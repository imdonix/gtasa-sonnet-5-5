<body style="margin:0;background:#222;overflow:hidden;font:12px monospace;color:#fff">

sg.fillStyle = gr; sg.fillRect(0, 0, 4, 256); const st = new THREE.CanvasTexture(sky); st.colorSpace = THREE.SRGBColorSpace; scene.background = st;

      const c = new THREE.Mesh(new THREE.RingGeometry(d.radius - 0.03, d.radius, 24), new THREE.MeshBasicMaterial({ color: d.solid ? 0x00ff00 : 0xffff00, side: THREE.DoubleSide })); c.rotation.x = -Math.PI / 2; c.position.set(px, 0.05, pz); scene.add(c);

box.expandByObject(ground); // not used

const dH = (size.x / 2 + 0.8) / Math.tan(hh) * (1 + Math.abs(dd.x) * 0.3), dV = ((size.z * Math.abs(dd.y) + size.y * Math.abs(dd.z)) / 2 + 1.2) / Math.tan(vh);

let drag = false; addEventListener('pointerdown', () => drag = true); addEventListener('pointerup', () => drag = false);
